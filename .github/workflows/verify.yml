name: Verify application syntax

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/cash-ledger-stock-approval]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Check inline browser JavaScript syntax
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('public/index.html','utf8');const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());if(!scripts.length)throw Error('No inline scripts found');fs.writeFileSync('/tmp/browser-inline.js',scripts.join('\\n'));"
          node --check /tmp/browser-inline.js
