<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electronics Shop Manager</title><style>
body{font:14px system-ui;margin:0;background:#f3f6fb;color:#172238}*{box-sizing:border-box}button,input,select{font:inherit;padding:10px;border:1px solid #d8e0ec;border-radius:8px}button{background:#245de8;color:white;cursor:pointer;border:0;font-weight:bold}.layout{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.nav{background:white;padding:12px}.nav button{display:block;width:100%;margin:4px 0;text-align:left;background:white;color:#223}.nav button.active{background:#eaf0ff;color:#245de8}.main{padding:20px;min-width:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:white;border:1px solid #e0e6f0;border-radius:12px;padding:16px;margin-bottom:14px}.muted{color:#718096}.page{display:none}.page.active{display:block}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e6ebf3;font-size:12px}.hidden{display:none!important}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select{width:100%}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{background:white;padding:20px;border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto}.msg{padding:10px;background:#ffefcf;margin:10px 0;border-radius:8px}.auth{max-width:400px;margin:8vh auto}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:12px}}</style></head><body>
<div id="auth" class="auth card hidden"><h1>Electronics Shop Manager</h1><p id="authSub" class="muted">Sign in</p><div id="authMsg" class="msg hidden"></div><form id="authForm"><div id="nameField" class="field hidden"><label>Your name</label><input name="name"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button id="authButton">Sign in</button></form></div>
<div id="app" class="layout hidden"><aside class="nav"><h3>⚡ ElectroDesk</h3><button class="active" data-page="dashboard">Dashboard</button><button data-page="products">Inventory</button><button data-page="customers">Customers & dues</button><button data-page="sales">Sales & invoices</button><button data-page="team">Team</button><button data-page="settings">Settings</button></aside><main class="main"><div class="bar"><div><b id="business">My Electronics Shop</b><div id="who" class="muted"></div></div><button id="logout">Sign out</button></div><hr>
<section id="dashboard" class="page active"><div class="bar"><h1>Dashboard</h1><button data-open="sale">Record sale</button></div><div id="metrics" class="cards"></div></section>
<section id="products" class="page"><div class="bar"><h1>Inventory</h1><div><button id="exportProducts">Export CSV</button><button data-open="product">Add product</button></div></div><div class="card"><input id="pq" placeholder="Search products or SKU"><button id="ps">Search</button><div class="table"><table><thead><tr><th>Name</th><th>SKU</th><th>Category</th><th>Purchase</th><th>Sale price</th><th>Stock</th><th></th></tr></thead><tbody id="pr"></tbody></table></div></div></section>
<section id="customers" class="page"><div class="bar"><h1>Customers & dues</h1><div><button id="exportCustomers">Export CSV</button><button data-open="customer">Add customer</button></div></div><div class="card"><input id="cq" placeholder="Search customers"><button id="cs">Search</button><div class="table"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Due</th></tr></thead><tbody id="cr"></tbody></table></div></div></section>
<section id="sales" class="page"><div class="bar"><h1>Sales & invoices</h1><div><button id="exportSales">Export CSV</button><button data-open="sale">Record sale</button></div></div><div class="card"><input id="sq" placeholder="Search invoices/customer"><button id="ss">Search</button><div class="table"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Paid</th><th>Due</th><th>Action</th></tr></thead><tbody id="sr"></tbody></table></div></div></section>
<section id="team" class="page"><div class="bar"><h1>Team</h1><button data-open="user" id="addUser">Add team member</button></div><div class="card table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead><tbody id="ur"></tbody></table></div></section>
<section id="settings" class="page"><h1>Settings</h1><div class="card"><form id="settingsForm"><div class="field"><label>Business name</label><input name="business_name" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Address</label><input name="address"></div><button>Save settings</button></form></div></section></main></div>
<div id="modal" class="modal"><div class="box"><div class="bar"><h2 id="mt">Add record</h2><button type="button" id="close">Close</button></div><p id="ms" class="muted"></p><div id="me" class="msg hidden"></div><form id="mf"><div id="fields"></div><button>Save</button></form></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let user,products=[],customers=[],editing=null,type="",settings={};const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),cash=x=>"৳ "+Number(x||0).toLocaleString("en-BD",{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(u,o={}){let r=await fetch(u,{credentials:"same-origin",...o,headers:{"Content-Type":"application/json",...(o.headers||{})}});let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||"Request failed");return d}function msg(x,bad=false){$("#me").textContent=x;$("#me").classList.remove("hidden");if(!bad)setTimeout(()=>$("#me").classList.add("hidden"),2500)}
async function boot(){try{let x=await api("/api/me");if(x.user){user=x.user;show()}else login()}catch(e){login(e.message)}}function login(error=""){$("#auth").classList.remove("hidden");$("#app").classList.add("hidden");if(error){$("#authMsg").textContent=error;$("#authMsg").classList.remove("hidden")}api("/api/setup-status").then(x=>{if(x.setup){$("#authSub").textContent="Create your first owner account";$("#nameField").classList.remove("hidden");$("#authButton").textContent="Create owner account";$("#authForm").dataset.setup="1"}}).catch(e=>{$("#authMsg").textContent=e.message;$("#authMsg").classList.remove("hidden")})}
$("#authForm").onsubmit=async e=>{e.preventDefault();try{let x=await api(e.target.dataset.setup?"/api/setup":"/api/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});user=x.user;show()}catch(x){$("#authMsg").textContent=x.message;$("#authMsg").classList.remove("hidden")}};
function show(){$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");$("#who").textContent=user.name+" · "+user.role;$("#addUser").classList.toggle("hidden",user.role!=="owner");loadDash();loadSettings()}$("#logout").onclick=async()=>{await fetch("/api/logout",{method:"POST"});login()};function go(p){$$(".page").forEach(x=>x.classList.toggle("active",x.id===p));$$("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===p));({dashboard:loadDash,products:loadProducts,customers:loadCustomers,sales:loadSales,team:loadUsers,settings:loadSettings}[p]||(()=>{}))()}$$("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
async function loadDash(){try{let d=await api("/api/dashboard");$("#metrics").innerHTML=[["Products",d.products],["Stock value",cash(d.stockValue)],["Low stock",d.lowStock],["Sales this month",cash(d.sales)],["Outstanding dues",cash(d.dues)],["Invoices",d.invoices],["Customers",d.customers]].map(a=>`<div class="card"><div class="muted">${a[0]}</div><h2>${a[1]}</h2></div>`).join("")}catch(e){alert(e.message)}}
async function loadProducts(){try{products=await api("/api/products?q="+encodeURIComponent($("#pq").value));$("#pr").innerHTML=products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${esc(p.category)} ${esc(p.brand)}</td><td>${cash(p.purchase_price)}</td><td>${cash(p.selling_price)}</td><td>${p.stock}${p.stock<=p.low_stock_at?" ⚠":""}</td><td>${["owner","manager"].includes(user.role)?`<button data-edit="${p.id}">Edit</button> <button data-del="${p.id}">Delete</button>`:""}</td></tr>`).join("")||"<tr><td colspan=7>No products.</td></tr>";$$("[data-edit]").forEach(b=>b.onclick=()=>open("product",products.find(p=>p.id==b.dataset.edit)));$$("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete product?")){try{await api("/api/products/"+b.dataset.del,{method:"DELETE"});loadProducts()}catch(e){alert(e.message)}}})}catch(e){alert(e.message)}}
async function loadCustomers(){try{customers=await api("/api/customers?q="+encodeURIComponent($("#cq").value));$("#cr").innerHTML=customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${cash(c.due)}</td></tr>`).join("")||"<tr><td colspan=4>No customers.</td></tr>"}catch(e){alert(e.message)}}
async function loadSales(){try{let rows=await api("/api/sales?q="+encodeURIComponent($("#sq").value));$("#sr").innerHTML=rows.map(s=>`<tr><td>${esc(s.invoice_no)}</td><td>${esc(s.customer_name)}</td><td>${new Date(s.created_at).toLocaleString()}</td><td>${cash(s.total)}</td><td>${cash(s.paid)}</td><td>${cash(s.balance)}</td><td>${Number(s.balance)>0?`<button data-pay="${s.id}">Payment</button>`:`<button data-print="${s.id}">Print</button>`}</td></tr>`).join("")||"<tr><td colspan=7>No sales.</td></tr>";$$("[data-pay]").forEach(b=>b.onclick=()=>open("payment",{id:b.dataset.pay}));$$("[data-print]").forEach(b=>b.onclick=()=>printInvoice(b.dataset.print))}catch(e){alert(e.message)}}
async function loadUsers(){try{let rows=await api("/api/users");$("#ur").innerHTML=rows.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?"Yes":"No"}</td></tr>`).join("")}catch(e){alert(e.message)}}async function loadSettings(){try{settings=await api("/api/settings");$("#business").textContent=settings.business_name||"My Electronics Shop";let f=$("#settingsForm");f.business_name.value=settings.business_name||"";f.phone.value=settings.phone||"";f.address.value=settings.address||""}catch(e){alert(e.message)}}
const fld=(n,l,t="text",v="")=>`<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${t==="number"?'min="0" step="0.01"':""} required></div>`;
async function open(t,r=null){type=t;editing=r?.id||null;$("#me").classList.add("hidden");let h="",f="";if(t==="product"){h=r?"Edit product":"Add product";f=fld("name","Name","text",r?.name||"")+fld("sku","SKU","text",r?.sku||"")+fld("category","Category","text",r?.category||"Accessories")+fld("brand","Brand","text",r?.brand||"")+fld("purchase_price","Purchase price","number",r?.purchase_price??0)+fld("selling_price","Selling price","number",r?.selling_price??0)+fld("stock","Stock","number",r?.stock??0)+fld("low_stock_at","Low stock threshold","number",r?.low_stock_at??3)}if(t==="customer"){h="Add customer";f=fld("name","Name")+fld("phone","Phone","tel")+fld("email","Email","email")+fld("address","Address")}if(t==="sale"){h="Record sale";await loadProducts();await loadCustomers();f=`<div class="field"><label>Customer</label><select name="customer_id"><option value="">Walk-in customer</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div id="items"></div><button type="button" id="addItem">Add item</button>`+fld("discount","Discount","number",0)+fld("paid","Paid now","number",0)}if(t==="payment"){h="Receive payment";f=fld("amount","Amount","number",0)+fld("note","Note","text","Payment received")}if(t==="user"){h="Add user";f=fld("name","Name")+fld("email","Email","email")+fld("password","Password (10+ chars)","password")+`<div class="field"><label>Role</label><select name="role"><option value="staff">Staff</option><option value="manager">Manager</option></select></div>`}$("#mt").textContent=h;$("#fields").innerHTML=f;$("#modal").classList.add("open");if(t==="sale"){const add=()=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<div class="field"><label>Product</label><select name="product_id"><option value="">Select</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.stock} available</option>`).join("")}</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" step="1" value="1"></div><div class="field"><label>Unit price</label><input name="unit_price" type="number" min="0" step="0.01"></div><button type="button">Remove line</button>`;d.querySelector('[name=product_id]').onchange=e=>d.querySelector('[name=unit_price]').value=products.find(p=>p.id==e.target.value)?.selling_price||0;d.querySelector("button").onclick=()=>d.remove();$("#items").appendChild(d)};$("#addItem").onclick=add;add()}}
$$("[data-open]").forEach(b=>b.onclick=()=>open(b.dataset.open));$("#close").onclick=()=>$("#modal").classList.remove("open");
$("#mf").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{if(type==="product"){["purchase_price","selling_price","stock","low_stock_at"].forEach(k=>d[k]=Number(d[k]));await api(editing?"/api/products/"+editing:"/api/products",{method:editing?"PUT":"POST",body:JSON.stringify(d)});loadProducts();loadDash()}else if(type==="customer"){await api("/api/customers",{method:"POST",body:JSON.stringify(d)});loadCustomers()}else if(type==="sale"){let items=[...$("#items").children].map(r=>({product_id:Number(r.querySelector('[name=product_id]').value),quantity:Number(r.querySelector('[name=quantity]').value),unit_price:Number(r.querySelector('[name=unit_price]').value)}));if(!items.length||items.some(x=>!x.product_id))throw Error("Choose a product on every line.");let cid=d.customer_id?Number(d.customer_id):null;await api("/api/sales",{method:"POST",body:JSON.stringify({customer_id:cid,customer_name:customers.find(c=>c.id===cid)?.name||"Walk-in customer",items,discount:Number(d.discount||0),paid:Number(d.paid||0)})});loadProducts();loadSales();loadDash()}else if(type==="payment"){d.amount=Number(d.amount);await api("/api/sales/"+editing+"/payment",{method:"POST",body:JSON.stringify(d)});loadSales();loadCustomers();loadDash()}else if(type==="user"){await api("/api/users",{method:"POST",body:JSON.stringify(d)});loadUsers()}$("#modal").classList.remove("open");e.target.reset()}catch(x){msg(x.message,true)}};
async function printInvoice(id){try{let d=await api("/api/sales/"+id),w=window.open("","_blank");if(!w)throw Error("Allow pop-ups for printing.");w.document.write(`<h1>${esc(settings.business_name||"Electronics Shop")}</h1><h2>Invoice ${esc(d.sale.invoice_no)}</h2><p>Customer: ${esc(d.sale.customer_name)}</p><table>${d.items.map(i=>`<tr><td>${esc(i.product_name)}</td><td>${i.quantity}</td><td>${cash(i.unit_price)}</td><td>${cash(i.line_total)}</td></tr>`).join("")}</table><h2>Total ${cash(d.sale.total)}</h2><p>Paid ${cash(d.sale.paid)} · Due ${cash(Number(d.sale.total)-Number(d.sale.paid))}</p>`);w.document.close();w.print()}catch(e){alert(e.message)}}
$("#exportProducts").onclick=()=>location.href="/api/export/products";$("#exportCustomers").onclick=()=>location.href="/api/export/customers";$("#exportSales").onclick=()=>location.href="/api/export/sales";$("#ps").onclick=loadProducts;$("#cs").onclick=loadCustomers;$("#ss").onclick=loadSales;$("#settingsForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/settings",{method:"PUT",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});loadSettings()}catch(x){alert(x.message)}};boot();
</script></body></html>
